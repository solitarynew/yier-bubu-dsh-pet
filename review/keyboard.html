<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一二布布 · 陪你敲敲</title>
<link rel="stylesheet" href="../desktop/keyboard-scene.css"><style>
*{box-sizing:border-box}body{margin:0;background:#f8f2e9;color:#654b40;font-family:'Segoe UI','Microsoft YaHei',sans-serif}main{max-width:1000px;margin:auto;padding:30px 30px 20px}.eyebrow{color:#b58c78;font-size:11px;letter-spacing:4px}h1{font-size:29px;font-weight:650;margin:12px 0 8px;letter-spacing:2px}p{font-size:13px;line-height:1.8;color:#9a7d6d;margin:0}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0 8px}button,select{font:inherit;font-size:13px;border:1px solid #e1cdbd;color:#795a4c;background:#fffcf6;border-radius:20px;padding:8px 15px;cursor:pointer}button[aria-pressed=true]{background:#eed5da;border-color:#d7acb8}.bear{position:relative;width:100%;height:470px}.bear[hidden]{display:none}.foot{display:flex;justify-content:space-between;gap:20px;border-top:1px solid #e6d8c8;margin-top:10px;padding-top:16px;color:#b09380;font-size:12px;line-height:1.8}.note{font-size:12px;color:#ac9383}@media(max-width:650px){main{padding:24px 16px}.bear{height:350px}.foot{flex-direction:column}}
</style></head><body><main><div class="eyebrow">YIER & BUBU / LITTLE TYPING COMPANIONS</div><h1>陪你敲敲，一起加油。</h1><p>第一套人物，原来的同框姿势。字母、空格、回车，每一下都有小爪子回应。</p>
<div class="controls"><select id="roles" aria-label="选择角色"><option value="pair">一二和布布 · 原图同框</option><option value="yier">只有一二</option><option value="bubu">只有布布</option></select><button id="demo" aria-pressed="false">播放演示</button><button id="pause" aria-pressed="false">暂停同步</button><button id="effects" aria-pressed="true">可爱动效：开</button><span class="note">点击空白处，试着敲键盘</span></div>
<div class="bears"><div class="bear" data-pet="pair"></div><div class="bear" data-pet="yier" hidden></div><div class="bear" data-pet="bubu" hidden></div></div><div class="foot"><span>32 个常用键 · 原图圆爪 · 小爱心</span><span>这里仅响应本页输入；Windows 桌宠可跟随其他窗口。</span></div></main>
<script src="../desktop/keyboard-model.js"></script><script src="../desktop/keyboard-art.js"></script><script src="../desktop/keyboard-scene.js"></script><script>
'use strict';
const {IDS}=window.YierKeyboardModel;
const scenes=[...document.querySelectorAll('.bear')].map(el=>({pet:el.dataset.pet,el,scene:window.YierKeyboardScene.mount(el,{pet:el.dataset.pet})}));
let held=new Set(),paused=false,effects=true,demoTimer=null,releaseTimer=null,index=0;
function paint(){let mask=0;for(const id of held)if(IDS.includes(id))mask+=2**IDS.indexOf(id);for(const {scene}of scenes)scene.receive({status:paused?'paused':'listening',mask:paused?0:mask,effects});}
function idFor(event){return /^Key[A-Z]$/.test(event.code)?event.code.slice(3):event.code.startsWith('Shift')?'Shift':IDS.includes(event.code)?event.code:null;}
function select(role){held.clear();for(const {el,pet}of scenes)el.hidden=pet!==role;document.querySelector('#roles').value=role;paint();}
function stopDemo(){clearInterval(demoTimer);clearTimeout(releaseTimer);demoTimer=null;document.querySelector('#demo').setAttribute('aria-pressed','false');document.querySelector('#demo').textContent='播放演示';held.clear();paint();}
addEventListener('keydown',event=>{if(['BUTTON','SELECT'].includes(document.activeElement.tagName))return;const id=idFor(event);if(!id)return;event.preventDefault();if(demoTimer)stopDemo();held.add(id);paint();});
addEventListener('keyup',event=>{const id=idFor(event);if(id){held.delete(id);paint();}});
addEventListener('blur',()=>{held.clear();paint();});
document.querySelector('#roles').onchange=event=>{select(event.target.value);event.target.blur();};
document.querySelector('#pause').onclick=event=>{paused=!paused;held.clear();paint();event.target.setAttribute('aria-pressed',String(paused));event.target.textContent=paused?'继续同步':'暂停同步';event.target.blur();};
document.querySelector('#effects').onclick=event=>{effects=!effects;paint();event.target.setAttribute('aria-pressed',String(effects));event.target.textContent='可爱动效：'+(effects?'开':'关');event.target.blur();};
document.querySelector('#demo').onclick=event=>{if(demoTimer){stopDemo();return;}event.target.setAttribute('aria-pressed','true');event.target.textContent='停止演示';event.target.blur();const sequence=[...'HELLO','Space',...'BUBU','Enter',...'YIER','Backspace','Enter'];demoTimer=setInterval(()=>{if(paused)return;held=new Set([sequence[index++%sequence.length]]);paint();releaseTimer=setTimeout(()=>{held.clear();paint();},150);},260);};
window.keyboardPreview={scenes,select,press(...ids){held=new Set(ids);paint();},release(){held.clear();paint();}};paint();
</script></body></html>
