<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一二布布 · 陪你敲敲</title>
<link rel="stylesheet" href="../desktop/keyboard-scene.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#f8f2e9;color:#654b40;font-family:'Segoe UI','Microsoft YaHei',sans-serif;min-height:100vh}main{max-width:1100px;margin:auto;padding:54px 32px 36px}.eyebrow{color:#b58c78;font-size:12px;letter-spacing:4px}h1{font-size:34px;font-weight:650;margin:15px 0 12px;letter-spacing:2px}p{font-size:14px;line-height:1.9;color:#9a7d6d;margin:0}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:25px 0 10px}button,select{font:inherit;font-size:13px;border:1px solid #e1cdbd;color:#795a4c;background:#fffcf6;border-radius:20px;padding:9px 17px;cursor:pointer}button[aria-pressed=true]{background:#eed5da;border-color:#d7acb8}.bears{display:flex;gap:18px;margin:25px -30px 0}.bear{position:relative;aspect-ratio:640/360;flex:1;min-width:0}.foot{display:flex;justify-content:space-between;gap:20px;border-top:1px solid #e6d8c8;margin-top:22px;padding-top:20px;color:#b09380;font-size:12px;line-height:1.8}.note{font-size:12px;color:#ac9383}@media(max-width:650px){main{padding:30px 20px}.bears{flex-direction:column;margin:0 -10px}.bear{flex:auto}.foot{flex-direction:column}}
</style></head><body><main><div class="eyebrow">YIER & BUBU / LITTLE TYPING COMPANIONS</div><h1>陪你敲敲，一起加油。</h1><p>你认真打字，我们认真陪你。<br>字母、空格、回车……每一下都有小爪子回应。</p><div class="controls"><select id="roles" aria-label="选择角色"><option value="pair">一二和布布</option><option value="yier">只有一二</option><option value="bubu">只有布布</option></select><button id="demo" aria-pressed="false">播放演示</button><button id="pause" aria-pressed="false">暂停同步</button><button id="effects" aria-pressed="true">可爱动效：开</button><span class="note">点击空白处，然后试着敲键盘</span></div><div class="bears"><div class="bear" data-pet="yier"></div><div class="bear" data-pet="bubu"></div></div><div class="foot"><span>32 个常用键 · 左右爪跟随 · 眨眼与小爱心</span><span>这里是交互预览，仅响应本页输入。<br>Windows 桌宠可跟随其他窗口中的键盘。</span></div></main>
<script src="../desktop/keyboard-model.js"></script><script src="../desktop/keyboard-art.js"></script><script src="../desktop/keyboard-scene.js"></script><script>
'use strict';
const {IDS}=window.YierKeyboardModel;
const scenes=[...document.querySelectorAll('.bear')].map(el=>({pet:el.dataset.pet,el,scene:window.YierKeyboardScene.mount(el,{pet:el.dataset.pet})}));
let held=new Set(),paused=false,effects=true,demoTimer=null,releaseTimer=null,index=0;
function paint(){let mask=0;for(const id of held)mask+=2**IDS.indexOf(id);for(const {scene}of scenes)scene.receive({status:paused?'paused':'listening',mask:paused?0:mask,effects});}
function idFor(event){return /^Key[A-Z]$/.test(event.code)?event.code.slice(3):event.code.startsWith('Shift')?'Shift':IDS.includes(event.code)?event.code:null;}
function stopDemo(){clearInterval(demoTimer);clearTimeout(releaseTimer);demoTimer=null;document.querySelector('#demo').setAttribute('aria-pressed','false');document.querySelector('#demo').textContent='播放演示';held.clear();paint();}
addEventListener('keydown',event=>{if(['BUTTON','SELECT'].includes(document.activeElement.tagName))return;const id=idFor(event);if(!id)return;event.preventDefault();if(demoTimer)stopDemo();held.add(id);paint();});
addEventListener('keyup',event=>{const id=idFor(event);if(id){held.delete(id);paint();}});
addEventListener('blur',()=>{held.clear();paint();});
document.querySelector('#roles').onchange=event=>{for(const {el,pet}of scenes)el.style.display=event.target.value==='pair'||event.target.value===pet?'':'none';event.target.blur();};
document.querySelector('#pause').onclick=event=>{paused=!paused;held.clear();paint();event.target.setAttribute('aria-pressed',String(paused));event.target.textContent=paused?'继续同步':'暂停同步';event.target.blur();};
document.querySelector('#effects').onclick=event=>{effects=!effects;paint();event.target.setAttribute('aria-pressed',String(effects));event.target.textContent='可爱动效：'+(effects?'开':'关');event.target.blur();};
document.querySelector('#demo').onclick=event=>{if(demoTimer){stopDemo();return;}event.target.setAttribute('aria-pressed','true');event.target.textContent='停止演示';event.target.blur();const sequence=[...'HELLO','Space',...'BUBU','Enter',...'YIER','Backspace','Enter'];demoTimer=setInterval(()=>{if(paused)return;held=new Set([sequence[index++%sequence.length]]);paint();releaseTimer=setTimeout(()=>{held.clear();paint();},150);},260);};
window.keyboardPreview={scenes,press(...ids){held=new Set(ids);paint();},release(){held.clear();paint();}};
paint();
</script></body></html>
